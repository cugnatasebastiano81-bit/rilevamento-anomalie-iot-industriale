name: Test suite

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Installa dipendenze
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Test con copertura
        run: pytest tests/ -v --cov=src --cov-report=term-missing

      - name: Esecuzione end-to-end del notebook (copia temporanea, timeout 20 minuti)
        run: |
          if [ ! -f "data/raw/iot_synth_anomaly_clustering.csv" ]; then
            echo "Dataset non presente (data/raw/*, escluso dal repository): step saltato." \
                 "Il notebook richiede il CSV reale per essere eseguito, vedi README.md."
            exit 0
          fi
          mkdir -p /tmp/notebook_ci_run
          jupyter nbconvert --to notebook --execute \
            --output-dir /tmp/notebook_ci_run \
            --ExecutePreprocessor.timeout=1200 \
            --ExecutePreprocessor.kernel_name=python3 \
            "notebooks/Rilevamento di anomalie in dati IoT con clustering-Sebastiano_Cugnata.ipynb"
        # esecuzione reale delle celle in ordine, fallisce se una cella solleva un errore o supera
        # il timeout; l'output eseguito va in una directory temporanea, il notebook versionato nel
        # repository non viene toccato da questo step. Salta (senza fallire la CI) quando il
        # dataset non è disponibile nel runner, come nel repository pubblico: in quel caso il
        # notebook va verificato eseguendolo in locale con una copia del CSV.

      - name: Esecuzione end-to-end del notebook Kaggle riproducibile
        run: |
          mkdir -p /tmp/kaggle_notebook_ci
          jupyter nbconvert --to notebook --execute \
            --output-dir /tmp/kaggle_notebook_ci \
            --ExecutePreprocessor.timeout=1200 \
            --ExecutePreprocessor.kernel_name=python3 \
            "kaggle/rilevamento_anomalie_iot_kaggle.ipynb"
        # Il notebook genera in memoria dati sintetici originali e non dipende da file privati.
